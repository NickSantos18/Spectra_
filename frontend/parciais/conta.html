<div class="canto-superior">
  <div class="conta-superior" data-conta hidden>
    <a class="conta-acesso" href="/painel/perfil" data-menu="perfil" data-perfil-acesso aria-label="Abrir meu perfil">
      <span class="conta-avatar" data-conta-inicial aria-hidden="true"></span>
      <span class="conta-nome-superior" data-conta-nome></span>
    </a>
    <button class="conta-icone-superior" type="button" data-sino aria-expanded="false" aria-controls="sino-lista" aria-label="Notificações" title="Notificações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="sino-contador" data-sino-contador hidden></span>
    </button>
    <a class="conta-icone-superior" href="/admin" data-admin-link hidden aria-label="Administração" title="Administração">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
    </a>
    <button class="conta-sair-superior" type="button" data-sair aria-label="Sair da conta" title="Sair da conta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
    <div class="sino-lista" id="sino-lista" data-sino-lista hidden role="region" aria-label="Notificações">
      <p class="sino-titulo">Notificações</p>
      <ul></ul>
    </div>
  </div>
  <button class="config-botao" type="button" data-abrir-configuracoes aria-controls="a11y-painel" aria-expanded="false" aria-label="Configurações" title="Configurações">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
      <path d="M4 6h8m4 0h4M4 12h3m4 0h9M4 18h11m4 0h1"/>
      <circle cx="14" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>
    </svg>
  </button>
  <button class="tema-botao" type="button" data-a11y-tema aria-label="Mudar para o tema claro" title="Mudar para o tema claro">
    <svg class="tema-astro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <mask id="tema-eclipse">
        <rect width="24" height="24" fill="#fff" stroke="none"/>
        <circle class="tema-sombra" cx="16.5" cy="7.5" r="7.5" fill="#000" stroke="none"/>
      </mask>
      <g mask="url(#tema-eclipse)"><circle class="tema-disco" cx="12" cy="12" r="9" fill="currentColor" stroke="none"/></g>
      <g class="tema-raios">
        <path d="M12 1.6v2.2"/><path d="m19.4 4.6-1.6 1.6"/><path d="M22.4 12h-2.2"/><path d="m19.4 19.4-1.6-1.6"/>
        <path d="M12 22.4v-2.2"/><path d="m4.6 19.4 1.6-1.6"/><path d="M1.6 12h2.2"/><path d="m4.6 4.6 1.6 1.6"/>
      </g>
    </svg>
  </button>
</div>
